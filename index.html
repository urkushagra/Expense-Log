<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ExpenseLog Pro</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

  <aside class="sidebar">

    <h1 class="logo">
      Expense<span>Log</span>
    </h1>

    <button class="nav-btn active">
      📊 Dashboard
    </button>

    <button class="nav-btn">
      💳 Transactions
    </button>

  </aside>

  <main class="main">

    <header class="topbar">

      <div>
        <h1>Expense Dashboard</h1>
        <p>Track your money smartly 🚀</p>
      </div>

      <div class="actions">

        <button id="themeBtn" class="btn secondary">
          🌙 Theme
        </button>

        <button id="openModalBtn" class="btn primary">
          + Add Transaction
        </button>

      </div>

    </header>

    <section class="stats">

      <div class="card">
        <small>Total Income</small>
        <h2 id="incomeValue">₹0</h2>
      </div>

      <div class="card">
        <small>Total Expense</small>
        <h2 id="expenseValue">₹0</h2>
      </div>

      <div class="card">
        <small>Balance</small>
        <h2 id="balanceValue">₹0</h2>
      </div>

    </section>

    <section class="table-card">

      <div class="table-header">

        <h2>Transactions</h2>

        <input
          type="text"
          id="searchInput"
          placeholder="Search..."
        >

      </div>

      <table>

        <thead>
          <tr>
            <th>Description</th>
            <th>Category</th>
            <th>Type</th>
            <th>Date</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>

    </section>

  </main>

</div>

<!-- Modal -->

<div class="modal" id="modal">

  <div class="modal-box">

    <h2>Add Transaction</h2>

    <input type="text" id="desc" placeholder="Description">

    <input type="number" id="amount" placeholder="Amount">

    <input type="date" id="date">

    <select id="category">
      <option>Food</option>
      <option>Shopping</option>
      <option>Transport</option>
      <option>Health</option>
      <option>Other</option>
    </select>

    <select id="type">
      <option value="expense">Expense</option>
      <option value="income">Income</option>
    </select>

    <button id="saveBtn" class="btn primary">
      Save Transaction
    </button>

  </div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
